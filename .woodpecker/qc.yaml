# Woodpecker CI — Linux PR-gate ported from .github/workflows/qc.yml (pr-gate job).
# Bun + real Postgres service. The post-deploy-smoke and docs-drift checks are now
# also on Woodpecker (sibling pipelines in this dir). Only the signed Windows
# release-supervisor and the Windows/macOS mobile builds stay on GitHub Actions —
# the Woodpecker runner is linux/amd64 only and signing secrets live in GHA.
when:
  - event: pull_request
    branch: main

labels:
  platform: linux/amd64

services:
  - name: postgres
    image: postgres:16
    environment:
      POSTGRES_USER: remo
      POSTGRES_PASSWORD: remo
      POSTGRES_DB: remo_ci

steps:
  - name: pr-gate
    image: oven/bun:latest
    environment:
      DATABASE_URL: postgres://remo:remo@postgres:5432/remo_ci
      JWT_SECRET: ci-placeholder-jwt-secret-min-32-chars-please-do-not-use-in-prod
      REMO_E2E_DB_URL: postgres://remo:remo@postgres:5432/remo_ci
      # The CI postgres service above is a disposable, ephemeral non-prod DB — opt in to the harness's non-local-host escape hatch.
      REMO_E2E_ALLOW_NONLOCAL: '1'
    commands:
      - apt-get update && apt-get install -y postgresql-client
      - 'until pg_isready -h postgres -U remo -d remo_ci; do echo waiting-pg; sleep 2; done'
      - bun install --frozen-lockfile
      # hub/tsconfig.json did not exist until this PR, so `tsc -p` exited 2 instantly and
      # the `|| echo` swallowed it: this step has NEVER typechecked anything. With the
      # config in place it now really runs — and surfaces 393 pre-existing errors
      # (200 hub/src, 192 hub/test, 1 hub/scripts) that accumulated while the check was
      # dead. The guard therefore STAYS for now; removing it would red every PR.
      # Follow-up: burn the 393 down, then delete the `|| echo` so this actually gates.
      - bunx tsc --noEmit -p hub/tsconfig.json || echo 'typecheck informational — 393 known pre-existing errors; see hub/tsconfig.json PR'
      # schema.sql re-runs IN FULL on every hub boot — hard-fail any un-pragma'd
      # UPDATE/INSERT/DELETE/DROP/TRUNCATE before it can re-fire against prod.
      - bun run schema-lint
      - bun run check-baseline
      # check-baseline covers hub/test only, so this SC-1 proof needs its own step here.
      - bun test supervisor/test/pty-usage-tail.test.ts
      - bun run migration-verify
      - bun test hub/test/orchestrator-data-model.test.ts hub/test/orchestrator-queue.test.ts hub/test/orchestrator-run-log.test.ts hub/test/orchestrator-stage-presets.test.ts hub/test/orchestrator-merge-command.test.ts hub/test/migrate-legacy-tasks.test.ts hub/test/feedback-key-ownership.test.ts
      # OEE orchestrator e2e prove-out — runs the OEE-01..09 suite against the real postgres:16 service (REMO_E2E_DB_URL set above) so the proof is VISIBLE in CI logs. check-baseline already executes these per-file; this is the explicit belt-and-suspenders run.
      - bun run orchestrator:e2e
