# CORCH-10 (R4.6): build the per-slot supervisor image on PRs. BUILD ONLY: dry_run, no registry push, no deploy.
when:
  - event: pull_request
    path:
      include:
        - 'Dockerfile.slot'
        - 'tools/slot-image/**'
        - 'tools/cloud-session/write-config.ts'
        - 'supervisor/**'
        - '.woodpecker/slot-image.yaml'

labels:
  platform: linux/amd64

steps:
  - name: slot-image-static-tests
    image: oven/bun:latest
    commands:
      - bun install --frozen-lockfile
      - bun test supervisor/test/corch-slot-image.test.ts

  - name: build-slot-image
    # docker CLI against the host daemon (fleet pattern, see mcp-servers image-smoke.yaml).
    # plugin-docker-buildx needs WOODPECKER_PLUGINS_PRIVILEGED and fails the linter here,
    # which errors the WHOLE pipeline config (qc included). Needs repo trusted.volumes=true
    # (already granted for mobile-shell-typecheck). Build only: no push, image removed after.
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - |
        set -eu
        IMG=remo-slot-ci:ci-$CI_PIPELINE_NUMBER
        trap 'docker rmi -f "$IMG" >/dev/null 2>&1 || true' EXIT
        docker build --platform linux/amd64 -f Dockerfile.slot -t "$IMG" .
