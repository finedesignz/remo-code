# Woodpecker CI — post-deploy prod smoke, ported from .github/workflows/qc.yml
# (post-deploy-smoke job). Runs on push to main, waits for the Coolify auto-deploy
# to roll out, then probes prod HTTPS. The signed Windows release-supervisor and
# the macOS/Windows mobile builds stay on GitHub Actions (no Windows/macOS runner).
when:
  - event: push
    branch: main

labels:
  platform: linux/amd64

steps:
  - name: smoke
    image: oven/bun:latest
    environment:
      # Defaults match the GHA job. To override, set these as Woodpecker repo
      # env vars (Settings → Environment) — they take precedence over the
      # in-script fallbacks below.
      SMOKE_BASE_URL: https://app.remo-code.com
      COOLIFY_DEPLOY_WAIT_SECONDS: '120'
    commands:
      - bun install --frozen-lockfile
      # Woodpecker interpolates ${...} as its OWN pipeline vars before the shell runs —
      # the original `sleep "${COOLIFY_DEPLOY_WAIT_SECONDS:-120}"` collapsed to `sleep ""`
      # (invalid time interval), failing every post-deploy smoke. Woodpecker can't parse
      # the shell `:-default` form either, so we drop the fallback (both vars are set in
      # the `environment:` block above) and escape `$` as `$$` so the POSIX shell expands.
      - |
        echo "sleeping $${COOLIFY_DEPLOY_WAIT_SECONDS}s for Coolify rollout"
        sleep "$${COOLIFY_DEPLOY_WAIT_SECONDS}"
      - |
        echo "smoking $${SMOKE_BASE_URL}"
        bun run smoke -- "$${SMOKE_BASE_URL}"
