# Woodpecker CI — post-deploy prod smoke, ported from .github/workflows/qc.yml
# (post-deploy-smoke job). Runs on push to main, waits for the Coolify auto-deploy
# to roll out, then probes prod HTTPS. The signed Windows release-supervisor and
# the macOS/Windows mobile builds stay on GitHub Actions (no Windows/macOS runner).
when:
  - event: push
    branch: main

labels:
  platform: linux/amd64

steps:
  - name: smoke
    image: oven/bun:latest
    commands:
      # NOTE: values are hardcoded on purpose. Woodpecker rewrites `${...}` as its own
      # pipeline vars before the shell runs (the original `sleep "${COOLIFY_DEPLOY_WAIT_SECONDS:-120}"`
      # collapsed to `sleep ""` → "invalid time interval", failing every smoke), and the
      # `${...}` / `$${...}` escape forms make Woodpecker's parser error ("unable to parse
      # variable name") which blocks the whole repo pipeline config. Plain literals avoid both.
      - bun install --frozen-lockfile
      - echo "sleeping 120s for Coolify rollout"
      - sleep 120
      - echo "smoking https://app.remo-code.com"
      - bun run smoke -- https://app.remo-code.com

# (re-triggered with a plain commit message to avoid the Woodpecker metadata var-parse error)
