# Woodpecker CI — post-deploy prod smoke, ported from .github/workflows/qc.yml
# (post-deploy-smoke job). Runs on push to main, waits for the Coolify auto-deploy
# to roll out, then probes prod HTTPS. The signed Windows release-supervisor and
# the macOS/Windows mobile builds stay on GitHub Actions (no Windows/macOS runner).
when:
  - event: push
    branch: main

labels:
  platform: linux/amd64

steps:
  - name: smoke
    image: oven/bun:latest
    commands:
      # Values are hardcoded on purpose. Woodpecker scans the whole file for its own
      # dollar-brace variable syntax (even inside comments and shell strings) and rewrites
      # it before the step runs, so any such reference collapsed the wait into an empty
      # sleep and any escaped form errored the parser. Plain literals avoid both. The
      # wait matches the Coolify rollout; the URL is the prod hub.
      - bun install --frozen-lockfile
      - echo "sleeping 120s for Coolify rollout"
      - sleep 120
      - echo "smoking https://app.remo-code.com"
      - bun run smoke -- https://app.remo-code.com
