# Ported from .github/workflows/mobile-shell-typecheck.yml (GHA purge, 2026-07-12).
# That workflow's push/pull_request triggers were commented out 2026-05-29 during the
# Phase 12 mobile pause (see docs/phase-12-pause-state.md) leaving only workflow_dispatch —
# i.e. it was dormant coverage burning zero CI minutes on GHA. Porting to Woodpecker
# restores real push/PR coverage on the linux/amd64 runner, path-filtered so it only
# fires when mobile/tauri actually changes.
when:
  - event: pull_request
    path:
      - "mobile/tauri/**"
      - ".woodpecker/mobile-shell-typecheck.yaml"
  - event: push
    branch: main
    path:
      - "mobile/tauri/**"
      - ".woodpecker/mobile-shell-typecheck.yaml"

labels:
  platform: linux/amd64

steps:
  - name: cargo-check
    image: rust:latest
    # Persistent cargo cache (added 2026-07-21). Cold Tauri dep compiles were
    # taking 30min+ and stalling agents; the old GHA used actions/cache for the
    # cargo registry + target dir. Woodpecker docker backend has no cache plugin
    # here, so we bind-mount a per-repo host dir shared across all agents on the
    # box. Requires repo trusted.volumes=true (granted via API). CARGO_HOME is a
    # fresh mounted path (registry + git + installed bins) — safe because the
    # rust image's toolchain proxies live in RUSTUP_HOME=/usr/local/rustup and
    # the cargo binary stays on PATH. CARGO_TARGET_DIR caches the compiled
    # dependency tree (the real 30min pole). Cargo's own file locks serialize any
    # concurrent runs sharing the dir rather than corrupting it.
    environment:
      CARGO_HOME: /cargo-cache/home
      CARGO_TARGET_DIR: /cargo-cache/target
    volumes:
      - /var/lib/woodpecker-cache/remo-code/home:/cargo-cache/home
      - /var/lib/woodpecker-cache/remo-code/target:/cargo-cache/target
    commands:
      - apt-get update && apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config
      # tauri::generate_context! resolves frontendDist ("../ui/dist") at compile
      # time and panics if it is absent. This is a Rust-only typecheck gate (no
      # bundling), so stub a minimal dist instead of building the vite UI.
      - mkdir -p mobile/tauri/ui/dist
      - echo '<!doctype html><title>remo-code mobile shell</title>' > mobile/tauri/ui/dist/index.html
      - cargo check --manifest-path mobile/tauri/src-tauri/Cargo.toml --target x86_64-unknown-linux-gnu
      - cargo test --manifest-path mobile/tauri/src-tauri/Cargo.toml --lib --target x86_64-unknown-linux-gnu
