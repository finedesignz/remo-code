[package]
name = "remo-supervisor-tauri"
version = "0.5.3"
description = "Remo Code Supervisor — Windows tray app"
authors = ["Fine Designz"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "remo_supervisor_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["time", "sync", "rt", "macros", "process", "io-util"] }
parking_lot = "0.12"
dirs = "5"
log = "0.4"
once_cell = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Networking_WinSock",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
