name: release-supervisor

# Cuts a GitHub Release for the Remo Code Supervisor (Tauri 2) app when a tag
# matching `supervisor-v*.*.*` is pushed. Builds the per-user NSIS installer
# (`-setup.exe`), signs it with the Tauri updater private key, and uploads both
# the installer and the signed `latest.json` manifest the in-app updater fetches.

on:
  push:
    tags:
      - 'supervisor-v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # tauri-action creates a GitHub Release

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: supervisor/tauri/src-tauri

      - name: Install UI deps
        working-directory: supervisor/tauri/ui
        run: bun install

      - name: Build UI
        working-directory: supervisor/tauri/ui
        run: bun run build

      - name: Compile supervisor sidecar binary
        working-directory: supervisor
        shell: bash
        run: |
          bun install
          mkdir -p tauri/src-tauri/binaries
          # Single-source the sidecar compile: supervisor/src/version.ts imports
          # tauri.conf.json directly and Bun inlines that JSON into the compiled
          # binary, so local + CI builds report the manifest version and can't drift.
          # The script lives at supervisor/scripts/compile-sidecar.mjs and is also
          # invoked by supervisor/tauri/scripts/build-and-update.ps1.
          bun run build:sidecar
          ls -la tauri/src-tauri/binaries/

      # ---------------------------------------------------------------------
      # Authenticode signing via Azure Trusted Signing (GATED, default OFF).
      #
      # These steps run ONLY when the repo variable ENABLE_MSI_SIGNING == 'true'.
      # Until the Azure cert profile exists and that variable is flipped on, none
      # of them run and the build is byte-for-byte identical to today's unsigned
      # release. See supervisor/tauri/signing/README.md.
      #
      # CORRECTNESS: signing happens DURING tauri bundling via bundle.windows.signCommand
      # (injected just below), so the Tauri updater .sig is computed over the already
      # Authenticode-signed MSI. A post-build signtool step would sign AFTER the updater
      # .sig was generated and break updater verification — so we must NOT do that.
      - name: Install Trusted Signing dlib (Microsoft.Trusted.Signing.Client)
        if: vars.ENABLE_MSI_SIGNING == 'true'
        shell: pwsh
        run: |
          $ver = '1.0.60'
          $out = Join-Path $env:RUNNER_TEMP 'trusted-signing'
          # nuget.exe ships on windows-latest runners; fall back to a direct install if not.
          # NOTE: no -ExcludeVersion flag. `-ExcludeVersion:$false` is PowerShell's
          # switch-with-value syntax, which only works on PS cmdlets — nuget.exe is a
          # NATIVE binary, so PowerShell hands it the literal string
          # "-ExcludeVersion:False" and nuget dies with `Unknown option`. The step then
          # hard-failed and signing was skipped entirely (v0.13.1's first signed build).
          # Omitting it is also what we want: nuget's DEFAULT keeps the version in the
          # folder name, which is exactly what the $dll path below expects.
          nuget install Microsoft.Trusted.Signing.Client -Version $ver -OutputDirectory $out
          $dll = Join-Path $out "Microsoft.Trusted.Signing.Client.$ver\bin\x64\Azure.CodeSigning.Dlib.dll"
          if (-not (Test-Path -LiteralPath $dll)) {
            Write-Error "Trusted Signing dlib not found at $dll"
            exit 1
          }
          "TRUSTED_SIGNING_DLIB=$dll" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "TRUSTED_SIGNING_DLIB=$dll"

      - name: Configure signing (cert profile + inject signCommand)
        if: vars.ENABLE_MSI_SIGNING == 'true'
        shell: pwsh
        run: |
          # (a) Optionally override CertificateProfileName from a secret/var without a code edit.
          $profile = '${{ vars.CERT_PROFILE_NAME }}'
          if ([string]::IsNullOrWhiteSpace($profile)) { $profile = '${{ secrets.CERT_PROFILE_NAME }}' }
          $metaPath = 'supervisor/tauri/signing/trusted-signing-metadata.json'
          if (-not [string]::IsNullOrWhiteSpace($profile)) {
            $meta = Get-Content -Raw -LiteralPath $metaPath | ConvertFrom-Json
            $meta.CertificateProfileName = $profile
            ($meta | ConvertTo-Json -Depth 10) | Set-Content -LiteralPath $metaPath -Encoding utf8
            Write-Host "CertificateProfileName overridden to '$profile'"
          } else {
            Write-Host "CERT_PROFILE_NAME unset; keeping committed default in $metaPath"
          }

          # (b) Inject bundle.windows.signCommand into tauri.conf.json for THIS build only.
          # Tauri runs signCommand with cwd = the src-tauri dir, so the script path is
          # relative to supervisor/tauri/src-tauri -> ../signing/sign.ps1.
          $confPath = 'supervisor/tauri/src-tauri/tauri.conf.json'
          $conf = Get-Content -Raw -LiteralPath $confPath | ConvertFrom-Json
          $signCmd = 'powershell -ExecutionPolicy Bypass -File ../signing/sign.ps1 %1'
          if (-not $conf.bundle.windows) {
            $conf.bundle | Add-Member -NotePropertyName windows -NotePropertyValue (@{}) -Force
          }
          $conf.bundle.windows | Add-Member -NotePropertyName signCommand -NotePropertyValue $signCmd -Force
          ($conf | ConvertTo-Json -Depth 20) | Set-Content -LiteralPath $confPath -Encoding utf8
          Write-Host "Injected bundle.windows.signCommand: $signCmd"

      - name: Build, sign, and release with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Azure Trusted Signing creds — harmless when signing is OFF (no signCommand
          # is injected, so the Dlib never runs and these vars are simply ignored).
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TRUSTED_SIGNING_DLIB: ${{ env.TRUSTED_SIGNING_DLIB }}
        with:
          projectPath: supervisor/tauri
          tagName: supervisor-v__VERSION__
          releaseName: 'Supervisor v__VERSION__'
          releaseBody: 'See the assets to download and install. The Windows installer (per-user NSIS) silently auto-updates existing installs via the in-app updater — no UAC prompt. NOTE: upgrading from a pre-0.13.0 per-machine MSI install requires a one-time manual reinstall of the new -setup.exe.'
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc
