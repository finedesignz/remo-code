name: mobile-shell-typecheck

# PAUSED 2026-05-29: Phase 12 (mobile Tauri) is on hold and the mobile shell
# does not currently compile, so this cargo-check was failing on every push to
# main and every mobile/workflow-touching PR — pure wasted CI. Reduced to
# manual-only (workflow_dispatch). RE-ENABLE the push/pull_request triggers
# below when mobile work resumes (see docs/phase-12-pause-state.md).
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - "mobile/tauri/**"
  #     - ".github/workflows/mobile-shell-typecheck.yml"
  # pull_request:
  #   paths:
  #     - "mobile/tauri/**"
  #     - ".github/workflows/mobile-shell-typecheck.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux WebView dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mobile/tauri/src-tauri/target
          key: ${{ runner.os }}-mobile-cargo-${{ hashFiles('mobile/tauri/src-tauri/Cargo.toml') }}

      - name: cargo check (host target)
        run: |
          cargo check \
            --manifest-path mobile/tauri/src-tauri/Cargo.toml \
            --target x86_64-unknown-linux-gnu

      - name: cargo test (lib unit tests)
        run: |
          cargo test \
            --manifest-path mobile/tauri/src-tauri/Cargo.toml \
            --lib \
            --target x86_64-unknown-linux-gnu
