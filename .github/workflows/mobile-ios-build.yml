# iOS build for the remo-code mobile Tauri shell.
#
# Status: unsigned .ipa for AltStore sideload on Windows. Real signing
# (Apple Developer cert + provisioning profile from repo secrets) is a
# follow-up — for now we lean on AltStore to re-sign the .ipa with the
# user's free Apple ID at sideload time.
#
# Gated by repo variable `ENABLE_IOS_BUILD == 'true'` to avoid burning
# macOS-runner minutes until the user opts in. Set at
# Settings → Secrets and variables → Actions → Variables.
#
# Prereq: the `mobile/tauri/src-tauri/gen/apple/` Xcode project must already
# exist on the branch. It is generated by an interactive
# `cargo tauri ios init` run that requires Xcode locally — see
# `docs/ios-sideload.md` for the one-shot MacInCloud runbook.

name: mobile-ios-build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile (debug | release)"
        required: false
        default: "release"
  push:
    tags:
      - "mobile-ios-v*"

concurrency:
  group: mobile-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    if: ${{ vars.ENABLE_IOS_BUILD == 'true' }}
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust + iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mobile/tauri/src-tauri/target
          key: ios-cargo-${{ hashFiles('mobile/tauri/src-tauri/Cargo.lock', 'mobile/tauri/src-tauri/Cargo.toml') }}
          restore-keys: |
            ios-cargo-

      - name: Install Tauri CLI 2.x
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install mobile UI deps
        working-directory: mobile/tauri/ui
        run: bun install --frozen-lockfile

      # `cargo tauri ios init` is interactive (asks about team ID and
      # device family). It is NOT scripted here — the gen/apple/ tree must
      # already exist. Fail fast with a pointer to the runbook so a user
      # who triggers this workflow before doing the MacInCloud step gets
      # an actionable error instead of an opaque `cargo tauri` failure.
      - name: Verify gen/apple exists
        run: |
          if [ ! -d mobile/tauri/src-tauri/gen/apple ]; then
            echo "::error::mobile/tauri/src-tauri/gen/apple/ is missing."
            echo "::error::Run the one-time MacInCloud init step from docs/ios-sideload.md,"
            echo "::error::commit the generated gen/apple/ tree, then re-run this workflow."
            exit 1
          fi

      - name: Typecheck only (PR path)
        if: github.event_name == 'pull_request'
        working-directory: mobile/tauri/src-tauri
        run: cargo check --target aarch64-apple-ios

      - name: Build iOS .ipa
        if: github.event_name != 'pull_request'
        working-directory: mobile/tauri
        # Unsigned build — AltStore re-signs on sideload. Once an Apple
        # Developer Program cert + provisioning profile are wired through
        # repo secrets, drop `--export-method development` for
        # `--export-method app-store` (or `ad-hoc`) and add `--ci`.
        run: cargo tauri ios build --export-method debugging

      - name: Locate .ipa
        if: github.event_name != 'pull_request'
        id: ipa
        run: |
          IPA_PATH=$(find mobile/tauri/src-tauri/gen/apple/build -name "*.ipa" -print -quit)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No .ipa produced under gen/apple/build"
            exit 1
          fi
          echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$IPA_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload .ipa artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: remo-code-mobile-ios-${{ github.sha }}
          path: ${{ steps.ipa.outputs.path }}
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/mobile-ios-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.ipa.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
