name: QC

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-gate:
    name: PR gate (typecheck + baseline + migration)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: remo
          POSTGRES_PASSWORD: remo
          POSTGRES_DB: remo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remo -d remo_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://remo:remo@localhost:5432/remo_ci
      JWT_SECRET: "ci-placeholder-jwt-secret-min-32-chars-please-do-not-use-in-prod"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Typecheck (hub)
        run: bunx tsc --noEmit -p hub/tsconfig.json
        continue-on-error: true   # first-run informational; promote to required after stability

      - name: Baseline regression check
        run: bun run check-baseline

      - name: Migration verify
        run: bun run migration-verify

      # Auto-Dev Orchestrator real-Postgres e2e — the enablement gate before
      # REMO_ORCHESTRATOR_ENABLED=1 in prod. These files SKIP unless REMO_E2E_DB_URL
      # is set; here we point it at the CI postgres service so the env-gated blocks
      # actually run. Required/blocking (no continue-on-error): asserts schema boots
      # clean + idempotent, the routine_queue global cap + per-session running-lock
      # (unique-violation path), orchestrator_approvals insert/consume idempotency,
      # routine_run_log round-trip, and the legacy-task migration apply + re-run.
      - name: Orchestrator Postgres e2e
        env:
          REMO_E2E_DB_URL: postgres://remo:remo@localhost:5432/remo_ci
        run: |
          bun test \
            hub/test/orchestrator-data-model.test.ts \
            hub/test/orchestrator-queue.test.ts \
            hub/test/orchestrator-run-log.test.ts \
            hub/test/orchestrator-stage-presets.test.ts \
            hub/test/orchestrator-merge-command.test.ts \
            hub/test/migrate-legacy-tasks.test.ts \
            hub/test/feedback-key-ownership.test.ts

  post-deploy-smoke:
    name: Post-deploy smoke (prod HTTPS)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Wait for Coolify deploy
        # Heuristic — give the auto-deploy a head start before probing.
        # Tune via repo var COOLIFY_DEPLOY_WAIT_SECONDS (default 120).
        run: |
          wait_s="${COOLIFY_DEPLOY_WAIT_SECONDS:-120}"
          echo "sleeping ${wait_s}s for Coolify rollout"
          sleep "${wait_s}"
        env:
          COOLIFY_DEPLOY_WAIT_SECONDS: ${{ vars.COOLIFY_DEPLOY_WAIT_SECONDS }}

      - name: Smoke prod
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL || 'https://app.remo-code.com' }}
        run: |
          if [ -z "$SMOKE_BASE_URL" ]; then
            echo "SMOKE_BASE_URL empty — skipping"
            exit 0
          fi
          bun run smoke -- "$SMOKE_BASE_URL"
